# IEUM Backend - Docker Compose 설정

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: ieum-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ieum}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=ko_KR.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ieum-network

  # Redis 캐시/큐 서비스
  redis:
    image: redis:7-alpine
    container_name: ieum-redis
    ports:
      - '6379:6379'
    volumes:
      - ieum-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ieum-network

  # Backend 서비스 (NestJS)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ieum-backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - SEED_DATA=${SEED_DATA:-false}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ieum
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ieum-network

volumes:
  postgres_data:
    driver: local
  ieum-redis-data:
    driver: local

networks:
  ieum-network:
    name: ieum_network
    driver: bridge
