# Nginx 기본 설정 (Traefik + Backend)

# 로그 레벨: development 또는 emergency
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log warn;

# 타임아웃 설정 (WebSockets 를 위한 긴 타임아웃)
send_timeout 60s;
client_max_body_size 20M;

server {
    # 포트 80 - HTTP(https 자동 리디렉션 없음)
    listen 80;
    
    server_name ieum.local;  # 로컬 DNS 또는 개발 도메인
    
    location /traefik/ {
        # Traefik Dashboard (API Gateway 설정 확인용)
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        # NestJS Backend (Swagger 포함)
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        
        # WebSocket 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 헤더 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cors 옵션 (필요시)
        proxy_read_timeout 60s;
    }

    location /health {
        # 건강 상태 체크 (K8S/Helm용)
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }
}