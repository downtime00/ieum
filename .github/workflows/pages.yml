name: Deploy to GitHub Pages

on:
  push:
    branches: [frontend]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate static site
        working-directory: frontend
        env:
          APP_BASE_URL: /ieum/
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:3001' }}
          NAVER_MAPS_CLIENT_ID: ti2q9d7nkv
          VAPID_PUBLIC_KEY: BKoySQaia2-gmrhMVscB_Ym9zVwxKqMTCFLDg5RYrmW9_CRH_Q5nxRbMzazt_2zq96heOYMfJk7hglv6W3WqAxA
        run: npm run generate

      - name: Prepare 404 fallback for SPA routing
        working-directory: frontend
        run: cp .output/public/index.html .output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
